name: Recibir versión
# Lo lanza el repo privado al subir la rama "entrega". Crea el Release público y borra la rama.
on:
  push:
    branches: [entrega]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(cat VERSION)
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          (cd archivos && unzip -q Vellmora-windows.zip && rm Vellmora-windows.zip && test -f Vellmora.exe)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target main --title "Vellmora $TAG" --notes "Android: Vellmora.apk. Windows: Vellmora.exe. Linux: Vellmora.AppImage. iPhone y navegador: https://rdarkstudio.github.io/jugar/

          Los archivos .pck son las actualizaciones automáticas del juego; no hace falta descargarlos."
          gh release upload "$TAG" archivos/* --clobber
      - name: Borrar la rama temporal
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/entrega"
