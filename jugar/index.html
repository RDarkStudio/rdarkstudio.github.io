<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Vellmora</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #120e0b;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
@font-face { font-family: MedievalSharp; src: url(../fuentes/MedievalSharp.ttf); font-display: swap; }
#empezar { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; padding: 1rem; text-align: center; color: #f1e4c6; background: linear-gradient(#120e0b66, #120e0bdd), url(../img/muro.png) 0 0 / 96px; font: 1.1rem/1.5 "Palatino Linotype", Palatino, Georgia, serif; }
#empezar[hidden] { display: none; }
#empezar h1 { margin: 0; color: #f0b43c; font: 4rem/1 MedievalSharp, serif; text-shadow: 0 4px 0 #2a1605; }
#empezar p { margin: 0; max-width: 24rem; color: #d9c9a6; }
#empezar button { padding: .55rem 1.5rem; border: 15px solid; border-image: url(../img/boton_oro.png) 15 fill / 15px; background: none; color: #2a1c05; font: 1.6rem MedievalSharp, serif; cursor: pointer; touch-action: manipulation; }
#empezar a { color: #f0b43c; touch-action: manipulation; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vellmora"><meta name="description" content="Juega a Vellmora en el navegador.">
	</head>
	<body>
		<canvas id="canvas">
			Tu navegador no puede mostrar el juego.
		</canvas>

		<noscript>
			Activa JavaScript para jugar.
		</noscript>

		<div id="empezar">
			<h1>Vellmora</h1>
			<button type="button" id="jugar">Toca para jugar</button>
			<p>Descarga unos 13 MB. La partida en curso no se guarda al cerrar; tus récords y desbloqueos quedan en este navegador.</p>
			<a href="../" target="_top">Volver a la página</a>
		</div>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":5221284,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	// Pantalla ancha: el juego es vertical, se muestra centrado en un marco.
	if (window.self === window.top && window.innerWidth > window.innerHeight * 0.8) {
		const marco = document.createElement('iframe');
		marco.src = 'index.html';
		marco.title = 'Vellmora';
		marco.allow = 'autoplay; fullscreen';
		marco.style.cssText = 'display:block;border:0;height:100dvh;width:min(100vw,60dvh);margin:0 auto';
		document.body.style.backgroundColor = '#120e0b';
		document.body.replaceChildren(marco);
		marco.focus();
		return;
	}
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Ocurrió un error al cargar. Recarga la página.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		document.getElementById('empezar').remove();
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'A tu navegador le falta algo que el juego necesita:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		document.getElementById('jugar').addEventListener('click', function () {
		document.getElementById('empezar').remove();
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
		}, { once: true });
	}
}());
		</script>
	</body>
</html>
